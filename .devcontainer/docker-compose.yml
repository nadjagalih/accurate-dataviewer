services:

  app:
    image: mcr.microsoft.com/devcontainers/php:8.4-bookworm

    volumes:
      - ..:/workspace/${localWorkspaceFolderBasename}:cached

    working_dir: /workspace/${localWorkspaceFolderBasename}

    command: sleep infinity

    depends_on:
      - mysql

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: accurate_integration
      DB_USERNAME: laravel
      DB_PASSWORD: secret


  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: accurate_integration
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql-data:/var/lib/mysql


volumes:

  mysql-data: